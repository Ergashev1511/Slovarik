services:
  - type: web
    name: slovarik-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /swagger
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Telegram__BotToken
        sync: false
      - key: Telegram__MiniAppUrl
        value: https://slovarik-ui.onrender.com
      - key: OpenAI__ApiKey
        sync: false
      - key: OpenAI__Model
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      - key: OpenAI__BaseUrl
        value: https://openrouter.ai/api/v1
      - key: Quiz__SharedSalt
        sync: false
